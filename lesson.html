<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Урок — Давлатов Академия</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#B8860B; --gold-l:#DAA520; --gold-bg:#FFF8E7;
    --primary:#1A1A2E; --bg:#F5F7FA; --text:#1A1A2E;
    --muted:#6B7280; --border:#E5E7EB;
    --green:#059669; --green-bg:#ECFDF5;
    --sh:0 2px 16px rgba(0,0,0,.08);
    --sh-h:0 8px 32px rgba(0,0,0,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

  /* ШАПКА */
  header{background:#fff;border-bottom:1px solid var(--border);
    box-shadow:0 1px 8px rgba(0,0,0,.06);padding:0 2rem;height:65px;
    flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--primary);text-decoration:none;}
  .logo span{color:var(--gold);}
  .back-btn{display:flex;align-items:center;gap:.5rem;background:#F3F4F6;
    border:1px solid var(--border);color:var(--muted);border-radius:10px;
    padding:.45rem 1rem;font-family:'Nunito',sans-serif;font-size:.88rem;
    font-weight:700;text-decoration:none;transition:all .2s;}
  .back-btn:hover{background:#E5E7EB;color:var(--text);}
  .user-pill{display:none;align-items:center;gap:.5rem;background:var(--gold-bg);
    border:1.5px solid rgba(184,134,11,.25);border-radius:20px;
    padding:.3rem .9rem .3rem .4rem;font-size:.85rem;font-weight:600;}
  .avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;
    font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;}

  /* ОСНОВНОЙ КОНТЕНТ */
  main{flex:1;max-width:860px;width:100%;margin:0 auto;padding:2rem 2rem 4rem;}

  .breadcrumb{font-size:.82rem;color:var(--muted);margin-bottom:1.2rem;
    display:flex;align-items:center;gap:.5rem;}
  .breadcrumb a{color:var(--muted);text-decoration:none;}
  .breadcrumb a:hover{color:var(--gold);}

  .lesson-badge{display:inline-block;background:var(--gold-bg);
    border:1.5px solid rgba(184,134,11,.3);color:var(--gold);
    font-size:.78rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
    padding:.35rem .9rem;border-radius:20px;margin-bottom:.8rem;}
  .lesson-title{font-family:'Playfair Display',serif;
    font-size:clamp(1.4rem,4vw,2rem);font-weight:900;
    line-height:1.2;margin-bottom:.4rem;color:var(--primary);}
  .lesson-meta{color:var(--muted);font-size:.85rem;margin-bottom:.5rem;font-weight:600;}

  /* Прогресс */
  .progress-bar-wrap{background:#E5E7EB;border-radius:20px;height:6px;
    margin-bottom:1.8rem;overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--gold);border-radius:20px;
    transition:width .4s ease;}
  .progress-label{font-size:.8rem;color:var(--muted);margin-bottom:.4rem;font-weight:600;}

  /* ═══ СПИСОК ЧАСТЕЙ ═══ */
  .parts-list{display:flex;flex-direction:column;gap:.8rem;}

  /* Карточка части */
  .part-card{
    background:#fff;border:1.5px solid var(--border);
    border-radius:16px;overflow:hidden;
    box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s;
  }
  .part-card.active{border-color:var(--gold);box-shadow:var(--sh-h);}
  .part-card.watched .part-header{background:var(--green-bg);}

  /* Заголовок части — кликабельный */
  .part-header{
    display:flex;align-items:center;gap:1rem;
    padding:1rem 1.2rem;cursor:pointer;
    transition:background .2s;user-select:none;
  }
  .part-header:hover{background:#FAFAFA;}
  .part-card.active .part-header{background:var(--gold-bg);}

  /* Номер части */
  .part-num{
    width:40px;height:40px;border-radius:50%;flex-shrink:0;
    background:var(--gold-bg);border:2px solid rgba(184,134,11,.3);
    color:var(--gold);font-weight:800;font-size:.9rem;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
  }
  .part-card.active .part-num{background:var(--gold);color:#fff;border-color:var(--gold);}
  .part-card.watched .part-num{background:var(--green-bg);border-color:rgba(5,150,105,.3);color:var(--green);}

  .part-info{flex:1;}
  .part-title{font-weight:700;font-size:.95rem;color:var(--primary);margin-bottom:.15rem;}
  .part-sub{font-size:.8rem;color:var(--muted);}

  /* Кнопка play / статус */
  .part-action{flex-shrink:0;}
  .play-btn{
    width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    background:var(--gold);color:#fff;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;box-shadow:0 2px 10px rgba(184,134,11,.4);
  }
  .play-btn:hover{background:var(--gold-l);transform:scale(1.08);}
  .play-btn:disabled{opacity:.6;cursor:wait;transform:none;}
  .play-btn svg{width:18px;height:18px;margin-left:2px;}

  /* Спиннер в кнопке */
  .btn-spinner{width:18px;height:18px;border-radius:50%;
    border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
    animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Значок просмотрено */
  .watched-icon{width:44px;height:44px;border-radius:50%;
    background:var(--green-bg);border:2px solid rgba(5,150,105,.3);
    color:var(--green);display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;}

  /* ═══ РАЗВЁРТЫВАЕМЫЙ ПЛЕЕР ═══ */
  .part-player{
    max-height:0;overflow:hidden;
    transition:max-height .35s ease;
    background:#000;
  }
  .part-player.open{max-height:600px;}

  /* iframe */
  .part-player iframe{
    width:100%;aspect-ratio:16/9;border:none;display:block;
  }

  /* Состояние загрузки внутри плеера */
  .player-loading-inner{
    width:100%;aspect-ratio:16/9;
    background:#111;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:1rem;
  }
  .player-loading-inner.show{display:flex;}
  .big-spinner{width:44px;height:44px;border-radius:50%;
    border:3px solid rgba(184,134,11,.25);border-top-color:var(--gold);
    animation:spin .8s linear infinite;}
  .player-loading-inner p{color:rgba(255,255,255,.5);font-size:.88rem;}

  /* Ошибка внутри плеера */
  .player-error-inner{
    width:100%;aspect-ratio:16/9;background:#1a0a0a;
    display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:.8rem;text-align:center;padding:2rem;
  }
  .player-error-inner.show{display:flex;}
  .player-error-inner span{font-size:2.5rem;}
  .player-error-inner h4{color:#ff7b6b;font-size:1rem;}
  .player-error-inner p{color:rgba(255,255,255,.45);font-size:.85rem;}
  .retry-btn{background:var(--gold);color:#fff;border:none;border-radius:8px;
    padding:.5rem 1.2rem;font-family:'Nunito',sans-serif;font-weight:700;
    font-size:.85rem;cursor:pointer;margin-top:.3rem;}

  /* Открыт в новой вкладке — подтверждение */
  .opened-confirm{
    width:100%;padding:1.2rem 1.5rem;background:#0d3d23;
    display:none;align-items:center;gap:.8rem;
  }
  .opened-confirm.show{display:flex;}
  .opened-confirm span{font-size:1.3rem;}
  .opened-confirm p{color:#2ECC71;font-size:.9rem;font-weight:600;}
  .opened-confirm small{color:rgba(255,255,255,.4);font-size:.8rem;display:block;}

  /* Описание урока */
  .desc-block{background:#fff;border:1px solid var(--border);border-radius:16px;
    padding:1.5rem 2rem;box-shadow:var(--sh);margin-top:1.5rem;}
  .desc-block h4{font-family:'Playfair Display',serif;font-size:1.05rem;
    font-weight:700;color:var(--gold);margin-bottom:.8rem;}
  .desc-block p{color:var(--muted);line-height:1.7;font-size:.95rem;}

  /* БЛОКИРОВКА */
  #blockedScreen{display:none;flex:1;align-items:center;justify-content:center;
    flex-direction:column;gap:1.5rem;text-align:center;padding:2rem;}
  #blockedScreen.show{display:flex;}
  .bl-icon{font-size:4rem;}
  .bl-title{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--primary);}
  .bl-sub{color:var(--muted);max-width:420px;line-height:1.7;}
  .countdown{color:var(--muted);font-size:.9rem;}
  .countdown strong{color:var(--gold);font-size:1.1rem;}
  .go-home{background:var(--gold);color:#fff;border:none;border-radius:12px;
    padding:.8rem 2rem;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;
    cursor:pointer;text-decoration:none;display:inline-block;transition:all .2s;
    box-shadow:0 4px 14px rgba(184,134,11,.35);}
  .go-home:hover{background:var(--gold-l);transform:translateY(-1px);}

  footer{border-top:1px solid var(--border);padding:1.5rem 2rem;
    text-align:center;color:var(--muted);font-size:.82rem;
    flex-shrink:0;background:#fff;}

  @media(max-width:600px){
    header{padding:0 1rem;}
    main{padding:1.2rem 1rem 3rem;}
    .part-header{padding:.85rem 1rem;gap:.8rem;}
    .part-num{width:34px;height:34px;font-size:.8rem;}
    .play-btn,.watched-icon{width:38px;height:38px;}
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">Давлатов <span>Академия</span></a>
  <div style="display:flex;align-items:center;gap:1rem;">
    <div class="user-pill" id="userPill">
      <div class="avatar-sm" id="userInitial"></div>
      <span id="userName"></span>
    </div>
    <a href="index.html" class="back-btn">← Назад</a>
  </div>
</header>

<!-- СТРАНИЦА УРОКА -->
<main id="lessonPage" style="display:none;">

  <div class="breadcrumb">
    <a href="index.html">Главная</a><span>›</span>
    <a href="index.html">Уроки</a><span>›</span>
    <span id="bcTitle"></span>
  </div>

  <div class="lesson-badge" id="lessonNum"></div>
  <h1 class="lesson-title" id="lessonTitle"></h1>
  <p class="lesson-meta">🎓 Саидмурод Давлатов</p>

  <!-- Прогресс -->
  <p class="progress-label" id="progressLabel"></p>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>

  <!-- Список частей -->
  <div class="parts-list" id="partsList"></div>

  <!-- Описание -->
  <div class="desc-block">
    <h4>📖 Об этом уроке</h4>
    <p id="lessonDesc"></p>
  </div>

</main>

<!-- БЛОКИРОВКА -->
<div id="blockedScreen">
  <div class="bl-icon">🚫</div>
  <div class="bl-title">Доступ запрещён</div>
  <p class="bl-sub">Эту страницу нельзя открыть напрямую.<br>Войдите на главной странице и нажмите кнопку урока.</p>
  <div class="countdown">Переход через <strong id="countNum">5</strong> сек...</div>
  <a href="index.html" class="go-home">← На главную</a>
</div>

<footer>© 2025 Давлатов Академия · Все права защищены</footer>

<script>
// ═══════════════════════════════════════════════════════
// КОНФИГ — тот же URL что в index.html
// ═══════════════════════════════════════════════════════
const SCRIPT_URL = 'https://script.google.com/macros/s/ВАШ_SCRIPT_ID/exec';

let token      = null;
let totalParts = 0;
let watchedParts = new Set(); // просмотренные части
let currentOpenPart = 0;      // сейчас открытая часть (0 = нет)

// ═══════════════════════════════════════════════════════
// ЗАГРУЗКА — проверяем токен
// ═══════════════════════════════════════════════════════
window.addEventListener('load', () => {
  const raw = sessionStorage.getItem('lesson_token');
  if (!raw) { showBlocked(); return; }

  try { token = JSON.parse(raw); }
  catch(e) { showBlocked(); return; }

  if (!token.ts || Date.now() - token.ts > 10 * 60 * 1000) {
    sessionStorage.removeItem('lesson_token');
    showBlocked(); return;
  }
  if (!token.lessonId || !token.userLogin) {
    sessionStorage.removeItem('lesson_token');
    showBlocked(); return;
  }

  sessionStorage.removeItem('lesson_token');
  totalParts = token.partsCount || 1;
  showLesson();
});

// ═══════════════════════════════════════════════════════
// ПОКАЗЫВАЕМ СТРАНИЦУ
// ═══════════════════════════════════════════════════════
function showLesson() {
  document.title = `Урок ${token.lessonId}: ${token.title} — Давлатов Академия`;

  document.getElementById('userPill').style.display  = 'flex';
  document.getElementById('userInitial').textContent = (token.userName||token.userLogin)[0].toUpperCase();
  document.getElementById('userName').textContent    = token.userName || token.userLogin;

  document.getElementById('bcTitle').textContent    = `Урок ${token.lessonId}`;
  document.getElementById('lessonNum').textContent  = `Урок ${token.lessonId}`;
  document.getElementById('lessonTitle').textContent = token.title;
  document.getElementById('lessonDesc').textContent  = token.desc || '';

  buildPartsList();
  updateProgress();

  document.getElementById('lessonPage').style.display = 'block';
}

// ═══════════════════════════════════════════════════════
// СТРОИМ СПИСОК ЧАСТЕЙ
// ═══════════════════════════════════════════════════════
function buildPartsList() {
  const list = document.getElementById('partsList');
  list.innerHTML = '';

  for (let i = 1; i <= totalParts; i++) {
    const card = document.createElement('div');
    card.className = 'part-card';
    card.id = `card-${i}`;

    card.innerHTML = `
      <!-- ЗАГОЛОВОК ЧАСТИ -->
      <div class="part-header" onclick="togglePart(${i})">
        <div class="part-num" id="num-${i}">${i}</div>
        <div class="part-info">
          <div class="part-title">Часть ${i}</div>
          <div class="part-sub" id="sub-${i}">Нажмите ▶ для просмотра</div>
        </div>
        <div class="part-action" id="action-${i}">
          <button class="play-btn" id="playbtn-${i}"
            onclick="event.stopPropagation(); startPart(${i}, this)"
            title="Смотреть часть ${i}">
            <svg viewBox="0 0 24 24" fill="white">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- ПЛЕЕР (раскрывается при нажатии) -->
      <div class="part-player" id="player-${i}">

        <!-- Спиннер загрузки -->
        <div class="player-loading-inner" id="loading-${i}">
          <div class="big-spinner"></div>
          <p>Проверяем доступ и загружаем часть ${i}...</p>
        </div>

        <!-- Подтверждение что открыто в новой вкладке -->
        <div class="opened-confirm" id="confirm-${i}">
          <span>✅</span>
          <div>
            <p>Часть ${i} открыта в новой вкладке!</p>
            <small>Вернитесь сюда чтобы перейти к следующей части</small>
          </div>
        </div>

        <!-- Ошибка -->
        <div class="player-error-inner" id="error-${i}">
          <span>🚫</span>
          <h4 id="errTitle-${i}">Ошибка</h4>
          <p id="errText-${i}">Попробуйте снова</p>
          <button class="retry-btn" onclick="startPart(${i}, document.getElementById('playbtn-${i}'))">Попробовать снова</button>
        </div>

      </div>`;

    list.appendChild(card);
  }
}

// ═══════════════════════════════════════════════════════
// ОТКРЫТЬ / ЗАКРЫТЬ ЧАСТЬ (аккордеон)
// ═══════════════════════════════════════════════════════
function togglePart(partNum) {
  const player = document.getElementById(`player-${partNum}`);
  const isOpen = player.classList.contains('open');

  // Закрываем все открытые
  closeAllPlayers();

  if (!isOpen) {
    // Открываем эту
    openPlayer(partNum);
  }
}

function openPlayer(partNum) {
  const card   = document.getElementById(`card-${partNum}`);
  const player = document.getElementById(`player-${partNum}`);
  card.classList.add('active');
  player.classList.add('open');
  currentOpenPart = partNum;

  // Прокручиваем к карточке
  setTimeout(() => {
    card.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }, 100);
}

function closeAllPlayers() {
  for (let i = 1; i <= totalParts; i++) {
    const card   = document.getElementById(`card-${i}`);
    const player = document.getElementById(`player-${i}`);
    if (card)   card.classList.remove('active');
    if (player) player.classList.remove('open');

    // Скрываем все внутренние состояния
    hideInnerStates(i);
  }
  currentOpenPart = 0;
}

function hideInnerStates(i) {
  const loading = document.getElementById(`loading-${i}`);
  const confirm = document.getElementById(`confirm-${i}`);
  const error   = document.getElementById(`error-${i}`);
  if (loading) loading.classList.remove('show');
  if (confirm) confirm.classList.remove('show');
  if (error)   error.classList.remove('show');
}

// ═══════════════════════════════════════════════════════
// ЗАПУСТИТЬ ЧАСТЬ — нажали кнопку ▶
//
// 1. Открываем аккордеон этой части
// 2. Показываем спиннер
// 3. Запрашиваем Apps Script — проверка доступа
// 4. Apps Script возвращает ID Google Vids
// 5. Открываем Google Vids в НОВОЙ ВКЛАДКЕ
// 6. Показываем подтверждение в аккордеоне
// ═══════════════════════════════════════════════════════
async function startPart(partNum, btn) {
  // Открываем аккордеон
  closeAllPlayers();
  openPlayer(partNum);

  // Блокируем кнопку, показываем спиннер
  btn.disabled = true;
  btn.innerHTML = '<div class="btn-spinner"></div>';

  // Показываем загрузку внутри плеера
  document.getElementById(`loading-${partNum}`).classList.add('show');
  document.getElementById(`confirm-${partNum}`).classList.remove('show');
  document.getElementById(`error-${partNum}`).classList.remove('show');

  try {
    const res  = await fetch(
      `${SCRIPT_URL}?action=getPart` +
      `&login=${encodeURIComponent(token.userLogin)}` +
      `&lessonId=${token.lessonId}` +
      `&part=${partNum}`
    );
    const data = await res.json();

    document.getElementById(`loading-${partNum}`).classList.remove('show');

    if (data.ok && data.videoId) {
      // ✅ Открываем Google Vids в новой вкладке
      const url = `https://docs.google.com/videos/d/${data.videoId}/edit`;
      window.open(url, '_blank');

      // Показываем подтверждение
      document.getElementById(`confirm-${partNum}`).classList.add('show');

      // Помечаем как просмотренную
      watchedParts.add(partNum);
      markWatched(partNum);
      updateProgress();

      // Обновляем подпись
      document.getElementById(`sub-${partNum}`).textContent = '✓ Просмотрено — нажмите снова для повтора';

    } else if (data.denied) {
      showPartError(partNum, '🚫 Доступ закрыт', 'Администратор закрыл ваш доступ.');
    } else {
      showPartError(partNum, '⚠ Ошибка', 'Не удалось загрузить. Попробуйте снова.');
    }

  } catch(e) {
    document.getElementById(`loading-${partNum}`).classList.remove('show');
    showPartError(partNum, '⚠ Нет соединения', 'Проверьте интернет и попробуйте снова.');
  }

  // Восстанавливаем кнопку
  btn.disabled = false;
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
}

function showPartError(partNum, title, text) {
  document.getElementById(`errTitle-${partNum}`).textContent = title;
  document.getElementById(`errText-${partNum}`).textContent  = text;
  document.getElementById(`error-${partNum}`).classList.add('show');
}

// ═══════════════════════════════════════════════════════
// ПОМЕТИТЬ ЧАСТЬ КАК ПРОСМОТРЕННУЮ
// ═══════════════════════════════════════════════════════
function markWatched(partNum) {
  const card   = document.getElementById(`card-${partNum}`);
  const numEl  = document.getElementById(`num-${partNum}`);
  const action = document.getElementById(`action-${partNum}`);

  if (card)   card.classList.add('watched');
  if (numEl)  numEl.textContent = '✓';
  if (action) action.innerHTML = `<div class="watched-icon">✓</div>`;
}

// ═══════════════════════════════════════════════════════
// ПРОГРЕСС
// ═══════════════════════════════════════════════════════
function updateProgress() {
  const done    = watchedParts.size;
  const pct     = totalParts > 0 ? Math.round(done / totalParts * 100) : 0;
  document.getElementById('progressFill').style.width  = pct + '%';
  document.getElementById('progressLabel').textContent =
    done === 0
      ? `0 из ${totalParts} частей просмотрено`
      : done === totalParts
        ? `✅ Все ${totalParts} части просмотрены!`
        : `${done} из ${totalParts} частей просмотрено`;
}

// ═══════════════════════════════════════════════════════
// БЛОКИРОВКА
// ═══════════════════════════════════════════════════════
function showBlocked() {
  document.getElementById('blockedScreen').classList.add('show');
  let n = 5;
  const el = document.getElementById('countNum');
  const t = setInterval(() => {
    n--; el.textContent = n;
    if (n <= 0) { clearInterval(t); window.location.href = 'index.html'; }
  }, 1000);
}
</script>
